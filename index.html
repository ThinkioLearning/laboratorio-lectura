  {
    id: 'a7',
    titulo: 'La paradoja de las redes sociales y la soledad moderna',
    tema: 'Psicología Social',
    texto: `Vivimos en la era más conectada de la historia humana. Con un toque en nuestras pantallas, podemos comunicarnos instantáneamente con personas al otro lado del planeta, acceder a comunidades de intereses compartidos, y mantenernos actualizados sobre vidas de cientos de "amigos". Sin embargo, estudios consistentemente demuestran que las generaciones más conectadas digitalmente también reportan los niveles más altos de soledad, aislamiento, y desconexión social. Esta contradicción—hiperconexión digital coexistiendo con aislamiento emocional profundo—define una paradoja central de la vida contemporánea.\n\nLa soledad en jóvenes ha aumentado dramáticamente. Una encuesta de Cigna de 2020 encontró que el 73% de la Generación Z (nacidos 1997-2012) reporta sentirse solo frecuentemente. Esto representa aumento significativo comparado con generaciones previas a la misma edad. Aunque correlación no prueba causalidad, la sincronía temporal entre adopción masiva de redes sociales y aumento en soledad es difícil de ignorar.\n\n¿Cómo puede conectividad digital coexistir con soledad? La respuesta reside en distinguir entre conexión y conexión significativa. Tener 1,000 seguidores o 500 amigos de Facebook no equivale a tener relaciones profundas, de confianza mutua, y emocionalmente sustantivas. Las redes sociales facilitan conexiones numerosas pero superficiales a expensas de relaciones intensas pero pocas.\n\nEl sociólogo Robert Putnam documentó el declive del "capital social"—redes de relaciones que proporcionan apoyo mutuo y sentido de pertenencia—en su libro "Bowling Alone". Aunque escribió antes de redes sociales modernas, su análisis se aplica prescriptamente: cuando interacciones cara a cara en clubes, iglesias, vecindarios, y otras instituciones comunitarias disminuyen, las conexiones digitales no compensan completamente la profundidad de esas relaciones físicas.\n\nLa calidad de interacción en redes sociales fundamentalmente difiere de interacciones presenciales. Comunicación humana evolutivamente se desarrolló como experiencia multisensorial: lenguaje corporal, expresiones faciales, tono de voz, contacto físico, incluso feromonas. Texto, emojis, e incluso videollamadas capturan solo fracción de esta riqueza comunicativa. La "lectura" emocional intuitiva que ocurre naturalmente cara a cara es mucho más difícil digitalmente, resultando en interacciones emocionalmente más pobres.\n\nEl fenómeno de "FOMO" (Fear of Missing Out—miedo a perderse algo) exacerba soledad. Redes sociales muestran constantemente resúmenes editados de vidas aparentemente emocionantes de otros: fiestas, viajes, logros, relaciones felices. Comparación social ascendente constante genera sensación de que todos demás están viviendo vidas más plenas, intensificando sentimientos de aislamiento y exclusión. La ironía es que casi todos están experimentando esta misma inseguridad mientras simultáneamente proyectan perfección externa.\n\nLa "amistad performativa" en redes sociales es superficial por diseño. Publicamos contenido no necesariamente para conexión genuina sino para performance de identidad curada, acumulando validación mediante likes y comentarios. Esta dinámica transforma relaciones en transacciones de capital social. Amistades se vuelven audiencias; autenticidad se sacrifica por presentación estratégica. Esto es emocionalmente agotador y fundamentalmente insatisfactorio.\n\nEl desplazamiento de tiempo es factor crítico. Las horas pasadas scrolling feeds son horas no invertidas en interacciones presenciales. Estudios muestran que tiempo excesivo en pantallas correlaciona con menos participación en actividades sociales físicas. Cuando estamos físicamente con otros pero psicológicamente absortos en pantallas ("phubbing"—phone snubbing), saboteamos oportunidades de conexión real disponibles.\n\nLa arquitectura de plataformas sociales incentiva interacción cuantitativa sobre cualitativa. Algoritmos priorizan engagement: clicks, shares, comentarios, tiempo en plataforma. Contenido emocionalmente resonante profundo raramente se viraliza comparado con contenido provocativo, polarizante, o superficialmente entretenido. Esta estructura premia interacciones rápidas y numerosas, no conversaciones profundas y sustantivas.\n\nLa pandemia de COVID-19 proporcionó experimento natural sobre dependencia de conexión digital. Durante lockdowns, redes sociales y videollamadas fueron literalmente salvavidas sociales. Sin embargo, incluso durante necesidad absoluta, estas conexiones no replicaron completamente satisfacción de interacción física. "Zoom fatigue" se volvió fenómeno reconocido; muchos encontraron videollamadas paradójicamente más agotadoras que conversaciones presenciales.\n\nVulnerabilidad auténtica—compartir inseguridades, miedos, fracasos—es fundamental para intimidad y conexión profunda. Pero redes sociales estructuralmente desalientan vulnerabilidad. El formato público y permanente incentiva presentación idealizada. Compartir luchas genuinas arriesga juicio, malentendidos, o peor, que sufrimiento personal se convierta en entretenimiento viral. Esta autocensura previene el tipo de apertura emocional que construye intimidad real.\n\nEcosistemas sociales digitales también fragmentan comunidades. En lugar de grupos geográficamente basados y demográficamente diversos, gravitamos hacia "cámaras de eco" de personas similares. Aunque nichos de interés compartido son valiosos, la pérdida de espacios mixtos donde interactuamos regularmente con personas diferentes—diferentes edades, ideologías, backgrounds—empobrece capital social y fomenta polarización.\n\nSoluciones requieren reconocer que tecnología no es neutral; activamente moldea comportamiento. Establecer límites intencionales: zonas libres de teléfonos, días de desintoxicación digital, priorizar interacciones presenciales. Usar tecnología de manera que facilite encuentros físicos en lugar de reemplazarlos. Cultivar conscientemente pocas amistades profundas en lugar de muchas conexiones superficiales.\n\nParadójicamente, reconocer limitaciones de conexión digital podría ayudarnos a usarla mejor. Redes sociales como herramienta para complementar—no reemplazar—relaciones presenciales pueden ser valiosas. Mantener contacto con amigos distantes, coordinar reuniones, compartir momentos significativos con círculo cercano: usos intencionales versus scroll compulsivo infinito. La tecnología no es enemiga; el problema es cómo la hemos permitido reestructurar vidas sociales de maneras que nos hacen paradójicamente más solitarios mientras estamos más "conectados" que nunca.`,

  {
    id: 'a8',
    titulo: 'Derechos de autor en la era de IA generativa',
    tema: 'Derecho y Tecnología',
    texto: `Cuando DALL-E, Midjourney y Stable Diffusion irrumpieron en 2022, generando imágenes impresionantes desde simples descripciones textuales, artistas reaccionaron con mezcla de asombro y horror. La tecnología era fascinante, pero había problema fundamental: estos modelos fueron entrenados en miles de millones de imágenes raspadas de internet, incluyendo trabajos de artistas sin permiso o compensación. ¿Es esto robo digital a escala masiva o uso legítimo de recursos públicamente disponibles? Esta pregunta está generando algunas de las batallas legales más importantes de la era digital.\n\nLa inteligencia artificial generativa funciona mediante aprendizaje estadístico de patrones en datos masivos. Para crear imágenes, modelos analizan millones de pares imagen-texto, aprendiendo asociaciones entre palabras y características visuales. Cuando solicitas "pintura al óleo de un gato en estilo Van Gogh", el modelo sintetiza nueva imagen basándose en patrones aprendidos, no copiando imágenes existentes directamente. Desarrolladores argumentan que esto es fundamentalmente similar a cómo humanos aprenden observando trabajos de otros artistas.\n\nArtistas contra-argumentan que hay diferencia crucial. Cuando humanos estudian arte, eventualmente desarrollan estilos únicos informados pero no determinados por influencias. Los modelos de IA, en contraste, son directa y cuantitativamente derivados de datos de entrenamiento. Sin acceso a trabajos protegidos por derechos de autor, estos sistemas literalmente no podrían existir en sus formas actuales. Además, pueden replicar estilos de artistas específicos con precisión inquietante, potencialmente devaluando trabajo original.\n\nLas primeras batallas legales importantes están en marcha. En enero de 2023, un grupo de artistas presentó demanda colectiva contra Stability AI, Midjourney y DeviantArt, alegando infracción masiva de derechos de autor. Getty Images demandó a Stability AI por usar millones de imágenes de su base de datos sin licencia. The New York Times demandó a OpenAI y Microsoft por usar artículos para entrenar ChatGPT. Estas demandas podrían establecer precedentes definiendo el futuro de IA generativa.\n\nLa doctrina legal central en disputa es "fair use" (uso legítimo). Esta permite uso limitado de material protegido sin permiso para propósitos como crítica, comentario, educación, e investigación. Factores considerados incluyen: propósito (comercial vs. educativo), naturaleza del trabajo original, cantidad usada, y efecto en mercado del original. Aplicar estos factores a IA es complejo: entrenamiento es técnicamente "transformativo", pero output compite directamente con artistas originales en mercados.\n\nEn Europa, el enfoque es diferente. GDPR ya proporcionaba protecciones de datos personales. La propuesta EU AI Act busca regular IA comprehensivamente, potencialmente requiriendo divulgación de datos de entrenamiento y respeto de opt-outs. Algunos países explícitamente requieren compensación por uso de trabajos en entrenamiento. Esta fragmentación regulatoria global creará desafíos para compañías tecnológicas operando internacionalmente.\n\nLa cuestión de autoría es igualmente compleja. Si uso Midjourney para generar imagen, ¿quién la posee? ¿Yo, como usuario que proporcionó prompt? ¿Midjourney, como creador de la herramienta? ¿Los artistas cuyos trabajos fueron datos de entrenamiento? Actualmente, en Estados Unidos, la Oficina de Derechos de Autor ha dictaminado que obras generadas puramente por IA sin contribución creativa humana significativa no son elegibles para copyright. Esto crea zona gris legal problemática.\n\nArtistas están respondiendo organizándose. Portfolios como ArtStation experimentaron protestas masivas, con artistas publicando imágenes anti-IA. Algunos usan herramientas como Glaze, que agregan perturbaciones imperceptibles a imágenes que "envenenan" modelos de IA intentando copiar estilos. Otros abogan por licencias obligatorias o esquemas de compensación donde creadores de IA pagan royalties a artistas cuyos trabajos fueron usados.\n\nLa industria tecnológica argumenta que restricciones excesivas sofocarán innovación. Adobe y otros están intentando enfoque intermedio: Firefly de Adobe fue entrenado solo en imágenes con licencia explícita o dominio público, posicionándose como opción "ética". Sin embargo, estos modelos generalmente producen resultados inferiores a competidores entrenados en datasets más amplios, ilustrando tensión entre ética y capacidad técnica.\n\nPerspectiva histórica proporciona contexto útil. Cuando fotografía emergió en siglo XIX, pintores temieron obsolescencia. Cuando sintetizadores musicales aparecieron, músicos protestaron. Sin embargo, estas tecnologías no eliminaron formas artísticas previas; transformaron y expandieron posibilidades creativas. ¿Será IA generativa similar, o representa cambio fundamentalmente diferente?\n\nLa diferencia crucial podría ser escala y velocidad. Tecnologías previas requirían habilidad humana significativa; fotografía requiere ojo artístico, sintetizadores requieren musicalidad. IA generativa, en contraste, permite a cualquiera producir resultados de apariencia profesional con esfuerzo mínimo. Esto podría inundar mercados, devaluando trabajo humano no mediante superioridad cualitativa sino mediante ventaja cuantitativa abrumadora.\n\nTambién existen implicaciones culturales más amplias. Si algoritmos entrenados predominantemente en arte occidental generan mayoría del nuevo "arte", ¿homogeneizamos estéticamente? ¿Qué sucede con tradiciones artísticas minoritarias subrepresentadas en datos de entrenamiento? ¿La IA generativa amplifica sesgos culturales existentes?\n\nLa resolución probablemente involucrará compromiso complejo. Sistemas de opt-in/opt-out permitiendo a creadores controlar si sus trabajos son usados. Mecanismos de compensación mediante licencias colectivas. Transparencia sobre datos de entrenamiento. Restricciones en replicación de estilos de artistas vivos sin permiso. Educación del público sobre diferencias entre creación humana y generada por IA.\n\nLo que está claro es que estamos en territorio legal no mapeado. Las leyes de propiedad intelectual fueron diseñadas para mundo pre-digital donde copiar requería esfuerzo significativo. IA generativa desafía suposiciones fundamentales sobre autoría, originalidad, y creatividad. Cómo sociedades resuelvan estas tensiones entre innovación tecnológica y protección de creatividad humana definirá tanto el futuro del arte como precedentes para cómo gobernamos tecnologías transformadoras.`,
    palabras: 1150,
    preguntas: [
      { pregunta: '¿Qué demandó Getty Images en 2023?', opciones: ['A Google','A Stability AI por usar millones de imágenes sin licencia','A Apple','A Amazon'], correcta: 1 },
      { pregunta: '¿Qué es "fair use"?', opciones: ['Copiar libremente','Uso limitado de material protegido sin permiso bajo ciertas condiciones','Vender copias','Modificar trabajos'], correcta: 1 },
      { pregunta: 'Según la Oficina de Derechos de Autor de EE.UU., ¿pueden obras puramente de IA tener copyright?', opciones: ['Sí, siempre','No, sin contribución humana significativa','Solo si son artísticas','Depende del precio'], correcta: 1 },
      { pregunta: '¿Qué es Glaze?', opciones: ['Un modelo de IA','Una red social','Herramienta que "envenena" modelos de IA para proteger estilos','Un filtro de Instagram'], correcta: 2 },
      { pregunta: '¿Cómo entrenó Adobe su modelo Firefly?', opciones: ['Con cualquier imagen de internet','Solo con imágenes con licencia explícita o dominio público','No lo entrenó','Con imágenes robadas'], correcta: 1 }
    ]

  {
    id: 'a9',
    titulo: 'Neuroplasticidad: Tu cerebro como arcilla moldeable',
    tema: 'Neurociencia',
    texto: `Durante la mayor parte de la historia de la neurociencia, se creyó que el cerebro adulto era esencialmente estático. Una vez completado el desarrollo en la adolescencia temprana, las conexiones neuronales estaban fijadas. Daño cerebral era permanente, capacidades cognitivas eran inmutables, y el viejo adagio "no puedes enseñar trucos nuevos a perro viejo" tenía respaldo científico aparente. Esta visión fue demolida por descubrimientos revolucionarios sobre neuroplasticidad: la capacidad del cerebro para reorganizarse formando nuevas conexiones neuronales a lo largo de la vida.\n\nEl caso de Jody Miller ilustra dramáticamente neuroplasticidad en acción. A los tres años, sufrió accidente cerebrovascular masivo destruyendo gran parte de hemisferio izquierdo, incluyendo áreas tradicionalmente consideradas esenciales para lenguaje. Según entendimiento convencional, debería haber quedado severamente discapacitada de por vida. Sin embargo, su cerebro joven se reorganizó: el hemisferio derecho asumió funciones de lenguaje, y ella eventualmente se recuperó casi completamente. Este tipo de reorganización dramática ocurre más fácilmente en niños, pero investigación ahora demuestra que cerebros adultos también retienen plasticidad significativa.\n\nLa neuroplasticidad opera en múltiples niveles. A nivel microscópico, sinapsis—conexiones entre neuronas—se fortalecen o debilitan basándose en uso. El principio "neuronas que disparan juntas se conectan juntas" (Hebb's Law) describe cómo experiencias repetidas esculpen circuitos neuronales. Cada vez que practicas guitarra, estudias vocabulario, o juegas videojuego, estás literalmente recableando tu cerebro.\n\nA nivel estructural, el cerebro puede generar nuevas neuronas (neurogénesis), particularmente en hipocampo, región crítica para memoria. Ejercicio, aprendizaje, y ambientes enriquecidos promueven neurogénesis; estrés crónico, privación de sueño, y aislamiento social la suprimen. Incluso la estructura física cerebral cambia: estudios de taxistas londinenses mostraron que tienen hipocampos significativamente más grandes que controles, resultado de años navegando calles complejas.\n\nA nivel funcional, áreas cerebrales pueden asumir nuevas funciones. Cuando personas ciegas aprenden Braille, corteza visual (normalmente procesando visión) se repurpone para procesar información táctil. Músicos profesionales desarrollan expansión de áreas cerebrales representando dedos. Bilingües muestran diferencias estructurales en regiones asociadas con control ejecutivo y función de lenguaje.\n\nLa ventana crítica de desarrollo infantil, cuando cerebros son extremadamente plásticos, es bien establecida. Esto explica por qué niños aprenden idiomas sin esfuerzo mientras adultos luchan, y por qué intervenciones tempranas para trastornos del desarrollo son críticas. Sin embargo, la revelación importante es que plasticidad adulta, aunque reducida, permanece substancial. Nunca es demasiado tarde para aprender habilidades nuevas o recuperarse de daño cerebral—solo requiere más tiempo y esfuerzo.\n\nImplicaciones terapéuticas son profundas. Rehabilitación post-accidente cerebrovascular explota neuroplasticidad mediante entrenamiento intensivo y repetitivo, "enseñando" a regiones cerebrales sanas asumir funciones de áreas dañadas. Terapia de restricción del movimiento inducido (CIMT) para rehabilitación de extremidades fuerza uso de miembro afectado, promoviendo reorganización neuronal. Resultados pueden ser dramáticos incluso años después de lesión, contradiendo expectativas pesimistas previas.\n\nEnfermedades neurodegenerativas como Alzheimer presentan desafío más complejo. Aunque neuroplasticidad permite cierta compensación, pérdida neuronal progresiva eventualmente abruma capacidades adaptativas. Sin embargo, investigación sugiere que "reserva cognitiva"—red neuronal más densa construida mediante estimulación intelectual lifetime—puede retrasar inicio de síntomas. Actividad mental robusta literalmente construye buffer contra deterioro.\n\nLa psicoterapia opera parcialmente mediante neuroplasticidad. Terapia cognitivo-conductual (CBT) para depresión o ansiedad esencialmente busca reconfigurar patrones de pensamiento disfuncionales, que neuronalmente significa debilitar circuitos asociados con rumiación negativa mientras fortalece circuitos de pensamiento adaptativo. Estudios de neuroimagen muestran cambios cerebrales medibles después de psicoterapia exitosa.\n\nPrácticas contemplativas como meditación demuestran neuroplasticidad poderosamente. Meditadores de largo plazo muestran diferencias estructurales en regiones asociadas con atención, regulación emocional, y conciencia corporal. Incluso después de solo ocho semanas de entrenamiento en mindfulness, estudios detectan cambios en estructura cerebral. Esto proporciona base neurocientífica para beneficios subjetivos reportados.\n\nEl "efecto Flynn"—aumento intergeneracional en puntajes de IQ—podría reflejar neuroplasticidad a escala societal. Ambientes modernos cognitivamente estimulantes (educación formal universal, tecnología, complejidad social) podrían estar moldeando cerebros poblacionales hacia capacidades cognitivas mejoradas.\n\nLimitaciones y advertencias son importantes. Neuroplasticidad no es panacea; existen límites a cuánto puede compensar o mejorar. Afirmaciones exageradas sobre "entrenamientos cerebrales" comerciales frecuentemente carecen de evidencia sólida. La capacidad del cerebro para cambiar también significa que puede cambiar negativamente: adicciones, trauma, y estrés crónico esculpen patrones neuronales desadaptativos.\n\nEducativamente, comprensión de neuroplasticidad es empoderador. Mentalidad de "crecimiento" versus "fija"—creer que habilidades pueden desarrollarse versus son innatas—afecta rendimiento académico. Cuando estudiantes entienden que inteligencia es moldeable mediante esfuerzo, perseveran más frente a dificultad. Neuroplasticidad proporciona base científica para esta mentalidad.\n\nPrincipios para maximizar neuroplasticidad beneficiosa: desafío constante (aprendizaje que empuja capacidades actuales), repetición deliberada (práctica enfocada de habilidades específicas), variedad (experiencias diversas construyen redes robustas), ejercicio físico (mejora neurogénesis y salud cerebral), sueño adecuado (consolida aprendizaje), nutrición apropiada, y manejo de estrés.\n\nLa neuroplasticidad fundamentalmente redefine potencial humano. No estamos limitados por configuraciones cerebrales fijas; somos proceso continuo de autocreación neurológica. Cada experiencia, pensamiento, y comportamiento esculpe quien somos a nivel más fundamental. Esto es simultáneamente empoderante—podemos cambiar—y genera responsabilidad: nuestras elecciones literalmente moldean nuestros cerebros. Comprender y aprovechar neuroplasticidad es herramienta poderosa para crecimiento personal, recuperación, y florecimiento humano.`,
    palabras: 1180,
    preguntas: [
      { pregunta: '¿Qué es neuroplasticidad?', opciones: ['Un tipo de cirugía','La capacidad del cerebro para reorganizarse formando nuevas conexiones','Una enfermedad','Un medicamento'], correcta: 1 },
      { pregunta: '¿Qué dice la ley de Hebb?', opciones: ['El cerebro no cambia','Neuronas que disparan juntas se conectan juntas','Solo los niños aprenden','El cerebro es inmutable'], correcta: 1 },
      { pregunta: '¿Qué mostraron estudios de taxistas londinenses?', opciones: ['Cerebros más pequeños','Hipocampos más grandes por navegar calles complejas','No hubo diferencias','Memoria más débil'], correcta: 1 },
      { pregunta: '¿Qué es neurogénesis?', opciones: ['Muerte de neuronas','Generación de nuevas neuronas','Un tipo de enfermedad','Una técnica de meditación'], correcta: 1 },
      { pregunta: '¿Qué es el "efecto Flynn"?', opciones: ['Disminución de inteligencia','Aumento intergeneracional en puntajes de IQ','Una enfermedad mental','Un tipo de memoria'], correcta: 1 }
    ]

  {
    id: 'a10',
    titulo: 'Microplásticos: La contaminación invisible que llevamos dentro',
    tema: 'Medio Ambiente y Salud',
    texto: `En 2022, un estudio publicado en Environment International reveló hallazgo inquietante: microplásticos fueron detectados en sangre humana por primera vez. No en algunos individuos, sino en 80% de participantes estudiados. Otro estudio encontró microplásticos en placentas humanas. Investigación subsecuente los ha identificado en pulmones, hígado, y hasta cerebros. Estamos literalmente hechos parcialmente de plástico, y las consecuencias de esta contaminación corporal pervasiva apenas comienzan a comprenderse.\n\nMicroplásticos son partículas plásticas menores a 5 milímetros. Nanoplásticos son aún más pequeños, menores a 1 micrómetro. Provienen de múltiples fuentes: fragmentación de plásticos más grandes en ambiente, fibras sintéticas de ropa durante lavado, desgaste de neumáticos, partículas de cosméticos, y degradación de envases. Están literalmente en todas partes: aire que respiramos, agua que bebemos, alimentos que comemos. Un estudio estimó que el estadounidense promedio ingiere equivalente a tarjeta de crédito de plástico (5 gramos) semanalmente.\n\nLa ubicuidad es asombrosa. Microplásticos han sido detectados en cimas de montañas remotas, hielo ártico, fosas oceánicas más profundas, e incluso lluvia. La Fosa de las Marianas, punto más profundo del océano, contiene microplásticos. No existe ecosistema en Tierra libre de esta contaminación. La atmósfera los transporta globalmente; partículas liberadas en ciudad pueden depositarse en océanos o glaciares miles de kilómetros distantes.\n\nEn océanos, la situación es particularmente crítica. Se estima que 51 trillones de partículas microplásticas contaminan océanos—500 veces más que estrellas en nuestra galaxia. La Gran Parche de Basura del Pacífico, área del tamaño de Texas donde corrientes concentran plásticos, es solo manifestación visible de problema mucho más pervasivo. Microplásticos permean toda la columna de agua, desde superficie hasta profundidades abisales.\n\nOrganismos marinos confunden microplásticos con alimento. Zooplancton, base de cadena alimentaria marina, ingiere partículas pensando que son fitoplancton. Desde allí, los plásticos bioacumulan: peces pequeños comen zooplancton contaminado, peces grandes comen peces pequeños, humanos comen peces grandes. Cada paso concentra contaminantes. Mariscos, especialmente mejillones y ostras que filtran grandes volúmenes de agua, están particularmente contaminados.\n\nLos efectos en salud humana son preocupación creciente pero con evidencia aún fragmentaria. Microplásticos no son inertes; muchos contienen o absorben químicos tóxicos: ftalatos (disrumpidores endocrinos), bisfenol A (BPA), retardantes de fuego, metales pesados. Cuando partículas plásticas ingresan al cuerpo, estos químicos pueden liberarse. Estudios en animales vinculan exposición a microplásticos con inflamación, estrés oxidativo, daño reproductivo, y alteraciones metabólicas.\n\nPartículas suficientemente pequeñas (nanoplásticos) pueden cruzar membranas celulares, potencialmente ingresando al torrente sanguíneo y distribuyéndose sistémicamente. Investigación preliminar sugiere que pueden atravesar barrera hematoencefálica y placenta, alcanzando cerebro y fetos. Las implicaciones para desarrollo neurológico y salud reproductiva son profundamente preocupantes pero requieren mucha más investigación.\n\nEstudios epidemiológicos están encontrando asociaciones. Investigación publicada en Environmental Health Perspectives encontró correlación entre exposición a microplásticos y marcadores de inflamación cardiovascular. Otro estudio vinculó exposición con enfermedad inflamatoria intestinal. Sin embargo, establecer causalidad es extremadamente difícil dada la exposición universal: no existe grupo de control "no expuesto" para comparación.\n\nLa producción de plástico continúa acelerándose exponencialmente. Desde 1950s hasta ahora, hemos producido más de 9 mil millones de toneladas de plástico. Actualmente producimos más de 400 millones de toneladas anualmente, cifra proyectada a duplicarse para 2040. Solo ~9% de todo el plástico producido ha sido reciclado; ~79% está en vertederos o ambiente; ~12% ha sido incinerado. El plástico producido hoy contaminará ambiente durante siglos.\n\nLa industria plástica, dominada por compañías petroquímicas, ha promovido reciclaje como solución mientras sabía que era en gran medida inviable económicamente. Documentos internos revelados muestran que industria entendía desde 1970s que reciclar plásticos mixtos era impracticable pero promovió la idea públicamente para evitar regulaciones y mantener producción. Esto es análogo a tácticas de industria tabacalera y combustibles fósiles: generar confusión sobre problema real para proteger ganancias.\n\nSoluciones individuales son limitadas pero no insignificantes. Reducir uso de plásticos de un solo uso, evitar textiles sintéticos cuando posible, usar botellas reutilizables, evitar cosméticos con microesferas. Sin embargo, acción individual es insuficiente frente a problema estructural masivo. Se necesita transformación sistémica.\n\nPolíticamente, progreso ha sido lento. Algunas jurisdicciones han prohibido microesferas en cosméticos, bolsas plásticas, o pajitas. Estos son pasos pero tocan solo fracción del problema. Tratado global sobre plásticos está siendo negociado bajo auspicio de Naciones Unidas, pero industria lobby intensamente contra regulaciones significativas. Propuestas incluyen limitar producción de plástico virgen, requerir diseño para reciclabilidad, establecer responsabilidad extendida del productor.\n\nInnovaciones tecnológicas ofrecen esperanza parcial. Plásticos biodegradables, aunque prometedores, frecuentemente requieren condiciones específicas para degradarse que no existen en ambiente natural. Bacterias y enzimas que pueden descomponer ciertos plásticos están siendo desarrolladas, pero escalar a nivel para abordar billones de toneladas de contaminación existente es desafío monumental. Tecnologías de limpieza oceánica como Ocean Cleanup capturan solo fracción de plásticos superficiales mientras microplásticos persisten.\n\nLa solución fundamental es reducción de fuente: producir dramáticamente menos plástico, particularmente de un solo uso. Esto requiere reimaginar sistemas de empaque, distribución de alimentos, y modelos de consumo. Transición a economía circular donde materiales son reutilizados indefinidamente en lugar de modelo lineal "tomar-hacer-desechar". Cambios así desafían intereses económicos poderosos y requieren voluntad política que ha sido difícil de movilizar.\n\nLa contaminación por microplásticos representa experimento ambiental y de salud pública masivo sin precedentes. Hemos saturado planeta entero, incluyendo nuestros propios cuerpos, con partículas sintéticas indestructibles antes de entender consecuencias. Las futuras generaciones mirarán atrás a nuestra era plástica con incredulidad similar a cómo vemos uso de asbesto o plomo ahora. La pregunta es si actuaremos suficientemente rápido para prevenir daños irreversibles o si continuaremos este experimento hasta que consecuencias sean innegables pero potencialmente irreversibles.`,
    palabras: 1180,
    preguntas: [
      { pregunta: 'Según estudio de 2022, ¿en qué porcentaje de muestras de sangre se encontraron microplásticos?', opciones: ['20%','50%','80%','100%'], correcta: 2 },
      { pregunta: '¿Cuánto plástico ingiere en promedio un estadounidense semanalmente según el estudio?', opciones: ['1 gramo','5 gramos (tarjeta de crédito)','10 gramos','100 gramos'], correcta: 1 },
      { pregunta: '¿Qué porcentaje de plástico producido ha sido reciclado?', opciones: ['~50%','~30%','~9%','~75%'], correcta: 2 },
      { pregunta: '¿Cuántas partículas microplásticas se estiman en océanos?', opciones: ['1 billón','51 trillones','100 millones','1 millón'], correcta: 1 },
      { pregunta: '¿Qué se proyecta sobre producción de plástico para 2040?', opciones: ['Disminuir a la mitad','Mantenerse igual','Duplicarse','Triplicarse'], correcta: 2 }
    ]
  },
  {
    id: 'a11',
    titulo: 'La nueva guerra fría: Rivalidad tecnológica China-EE.UU.',
    tema: 'Geopolítica y Tecnología',
    texto: `En octubre de 2022, Estados Unidos implementó restricciones de exportación sin precedentes diseñadas específicamente para frenar industria de semiconductores de China. No era solo regulación comercial rutinaria; era salvo deliberado en lo que analistas llaman "nueva guerra fría tecnológica". A diferencia de rivalidad EE.UU.-URSS del siglo XX centrada en armas nucleares e ideología, esta competencia se centra en tecnologías que definirán poder económico y militar del siglo XXI: semiconductores, inteligencia artificial, computación cuántica, telecomunicaciones 5G, y biotecnología.\n\nLa importancia estratégica de semiconductores no puede subestimarse. Estos chips microscópicos están en todo: smartphones, automóviles, electrodomésticos, sistemas de armamento, satélites, infraestructura crítica. Quien controla producción de semiconductores avanzados controla tecnología moderna. Actualmente, Taiwan domina producción: TSMC (Taiwan Semiconductor Manufacturing Company) fabrica más del 90% de chips más avanzados mundialmente. Esta concentración extrema crea vulnerabilidad geopolítica crítica.\n\nChina importa más semiconductores que petróleo, gastando más de $400 mil millones anualmente—su mayor categoría de importación. Esta dependencia es debilidad estratégica inaceptable desde perspectiva de Beijing. Programa "Made in China 2025" explícitamente busca autosuficiencia en semiconductores y otras tecnologías críticas. China ha invertido cientos de miles de millones en desarrollar capacidad doméstica, progresando significativamente pero aún rezagada en nodos más avanzados (chips de 3-5 nanómetros).\n\nLas restricciones estadounidenses de 2022 son estrategia de estrangulamiento tecnológico. Prohíben empresas estadounidenses vender equipamiento avanzado de fabricación de semiconductores a China y prohíben ciudadanos estadounidenses trabajar en industria china de semiconductores sin licencia. Incluso empresas extranjeras usando tecnología estadounidense (prácticamente todas) deben cumplir. El objetivo: prevenir que China alcance paridad tecnológica en semiconductores avanzados críticos para IA militar y aplicaciones.\n\nChina responde mediante inversión masiva acelerada, intento de desarrollar cadena de suministro independiente, y potencialmente represalias económicas. Ha restringido exportaciones de metales de tierras raras críticos (domina producción mundial), investigado empresas estadounidenses bajo leyes antimonopolio, y está considerando restricciones en tecnologías donde tiene ventaja, como drones o baterías.\n\nLa rivalidad en IA es particularmente intensa. IA tiene aplicaciones militares profundas: sistemas de armamento autónomo, ciberseguridad, vigilancia, reconocimiento facial, análisis de inteligencia. También determina competitividad económica futura. Ambas naciones invierten agresivamente. China tiene ventaja en datos (población masiva, menos restricciones de privacidad) mientras EE.UU. lidera en chips avanzados y talento de investigación (por ahora).\n\nLa controversia sobre Huawei ejemplifica dimensiones de seguridad. EE.UU. argumentó que equipamiento 5G de Huawei representa riesgo de espionaje, potencialmente dando a Beijing acceso a infraestructura de telecomunicaciones global. Presionó aliados para prohibir Huawei, con éxito mixto. Europa está dividida; algunos países prohibieron, otros permitieron con restricciones. Australia y Japón excluyeron Huawei; Reino Unido inicialmente permitió pero luego revirtió bajo presión estadounidense.\n\nTikTok es otro campo de batalla. Preocupaciones sobre compañía china recopilando datos masivos de usuarios estadounidenses y potencial influencia de algoritmos en información que jóvenes consumen llevaron a amenazas de prohibición. India ya prohibió TikTok. EE.UU. exigió venta a entidad estadounidense pero acuerdo completo no se materializó. Esto ilustra cómo apps aparentemente inocuas se perciben como riesgos de seguridad nacional en contexto de rivalidad sistémica.\n\nTaiwan es epicentro de tensiones. China considera Taiwan provincia rebelde que debe "reunificarse" con continente, por fuerza si necesario. Taiwan es democracia vibrante que valora independencia de facto. Para EE.UU., Taiwan es aliado crítico y clave para semiconductores. Escenario de invasión china de Taiwan desencadenaría posiblemente conflicto más catastrófico desde Segunda Guerra Mundial, potencialmente convirtiéndose en confrontación nuclear EE.UU.-China. Además causaría colapso de cadena de suministro de semiconductores, devastando economía global.\n\nLa desconexión tecnológica ("decoupling") tiene costos masivos. Cadenas de suministro globales están profundamente integradas. Smartphones contienen componentes de docenas de países. Forzar división en ecosistemas tecnológicos separados es tremendamente ineficiente. Duplicación de investigación y desarrollo, pérdida de economías de escala, mercados fragmentados: todo reduce productividad e innovación mientras aumenta costos. Consumidores globalmente pagarán.\n\nAliados de EE.UU. están en posición incómoda. Europa, Japón, Corea del Sur, Australia tienen relaciones de seguridad profundas con EE.UU. pero relaciones económicas masivas con China. Forzarlos a "elegir lado" crea dilemas dolorosos. Corea del Sur, hogar de Samsung (mayor competidor de TSMC), está particularmente presionada. Europea depende de mercado chino para automóviles y maquinaria mientras simultáneamente preocupándose por influencia china.\n\nLa cooperación en desafíos globales—cambio climático, pandemias, proliferación nuclear—requiere coordinación EE.UU.-China. Rivalidad sistémica dificulta esa cooperación precisamente cuando es más necesaria. Ambas naciones representan aproximadamente 40% de emisiones globales; acción climática sin cooperación bilateral es virtualmente imposible. Dinámicas de suma cero en tecnología sangran a áreas donde cooperación sería mutuamente beneficiosa.\n\nEl riesgo de escalación es real. Conflictos históricos entre potencias establecidas y ascendentes frecuentemente terminan en guerra—la "trampa de Tucídides". Aunque guerra directa entre potencias nucleares es impensable, malentendidos, incidentes, o guerras proxy en lugares como Taiwan, Mar de China Meridional, o ciberespacio podrían escalar peligrosamente. Establecer "barandillas" para prevenir accidentes es crítico pero difícil cuando confianza es baja.\n\nLa competencia tecnológica no es inherentemente negativa. Históricamente, rivalidad EE.UU.-URSS impulsó carrera espacial, produciendo innovaciones que beneficiaron humanidad. Competencia actual podría acelerar desarrollo de IA, computación cuántica, energía limpia. La cuestión es si competencia puede mantenerse dentro de límites evitando conflicto abierto mientras permitiendo cooperación donde necesaria.\n\nEl mundo multipolar emergiendo es más complejo que bipolaridad Guerra Fría. Potencias medianas como India, Brasil, Indonesia rehúsan alinearse rígidamente. Actores no estatales—corporaciones tecnológicas masivas, redes ciberdelincuentes, movimientos transnacionales—complican dinámicas tradicionales de poder estatal. Gobernar tecnologías transformadoras en este contexto fragmentado es desafío sin precedentes históricos.\n\nLa rivalidad tecnológica China-EE.UU. definirá geopolítica de próximas décadas. Determinará no solo balance de poder sino también qué tipo de futuro tecnológico habitaremos: sistemas abiertos versus cerrados, democracia versus autoritarismo habilitado tecnológicamente, cooperación global versus bloques rivales. Stakes no podrían ser más altos para todos en planeta.`,
    palabras: 1240,
    preguntas: [
      { pregunta: '¿Qué porcentaje de chips avanzados produce TSMC de Taiwan?', opciones: ['50%','70%','Más del 90%','30%'], correcta: 2 },
      { pregunta: '¿Cuánto gasta China anualmente en importación de semiconductores?', opciones: ['$100 mil millones','$200 mil millones','Más de $400 mil millones','$50 mil millones'], correcta: 2 },
      { pregunta: '¿Qué busca el programa "Made in China 2025"?', opciones: ['Importar más','Autosuficiencia en tecnologías críticas','Vender más','Cooperar con EE.UU.'], correcta: 1 },
      { pregunta: '¿Qué país ya prohibió TikTok?', opciones: ['Canadá','India','Francia','Brasil'], correcta: 1 },
      { pregunta: '¿Qué es la "trampa de Tucídides"?', opciones: ['Un videojuego','Riesgo de guerra entre potencia establecida y ascendente','Una teoría económica','Un tratado comercial'], correcta: 1 }
    ]
  },
  {
    id: 'a12',
    titulo: 'El futuro del trabajo: ¿Quién sobrevivirá la automatización?',
    tema: 'Economía y Sociedad',
    texto: `En 2013, investigadores de Oxford publicaron estudio proyectando que 47% de empleos estadounidenses estaban en "alto riesgo" de automatización en próximas dos décadas. Una década después, esa predicción parece simultáneamente exagerada en ciertos aspectos pero subestimada en otros. La automatización no está causando desempleo masivo inmediato que algunos predijeron, pero está transformando trabajo de maneras profundas y frecuentemente invisibles, redistribuyendo poder económico, y planteando preguntas fundamentales sobre propósito, significado, y organización social en mundo donde trabajo humano es cada vez menos necesario económicamente.\n\nLa historia de automatización es larga. La Revolución Industrial eliminó mayoría de empleos agrícolas. Mecanización del siglo XX redujo trabajo manufacturero. Sin embargo, nuevos empleos emergieron: la automatización destruye trabajos específicos pero históricamente ha creado más empleos de los que elimina, frecuentemente requiriendo habilidades diferentes y pagando salarios diferentes. La cuestión crucial es si esta vez es diferente—si inteligencia artificial y robótica avanzada representan cambio cualitativo, no solo cuantitativo.\n\nLo que hace a IA potencialmente diferente es que automatiza trabajo cognitivo, no solo físico. Abogados paralegales que revisan documentos, radiólogos que interpretan imágenes médicas, analistas financieros que evalúan inversiones, programadores que escriben código: todas estas profesiones altamente educadas y bien remuneradas enfrentan automatización significativa. Anteriormente, "estudiar más" era respuesta a automatización; si IA puede hacer trabajo cognitivo complejo, ¿hacia dónde se reentrenan trabajadores?\n\nEl patrón de automatización es desigual e inesperado. Trabajos que parecen "rutinarios" son más automatizables, pero "rutinario" no corresponde a prestigio o pago. Cirugía robótica avanza lentamente mientras Amazon implementa robots de almacén masivamente. Abogados corporativos usan IA para revisión de documentos mientras trabajadores de cuidado infantil—mal pagados, baja prestigio—son difíciles de automatizar porque requieren empatía humana, flexibilidad, y juicio contextual complejo que IA aún no replica.\n\nEsta polarización del mercado laboral es tendencia establecida. Empleos de salario medio—manufactura, trabajos administrativos—han sido vaciados mediante automatización y offshoring. Crecimiento se concentra en extremos: empleos altamente remunerados requiriendo habilidades especializadas (tecnología, finanzas, medicina) y empleos de bajos salarios en servicios personales (cuidado, limpieza, comida). La "clase media" trabajadora está siendo erosionada, con implicaciones políticas y sociales profundas.\n\nLa "gig economy" refleja estas transformaciones. Uber, DoorDash, TaskRabbit, Fiverr: plataformas que desagregan trabajo en tareas discretas y mercantilizan labor humana a escala sin precedentes. Trabajadores son "contratistas independientes", no empleados, privándolos de beneficios, seguridad laboral, y poder de negociación. Esta "uberización" aumenta flexibilidad pero precariza existencia, transfiriendo riesgos de empresas a individuos.\n\nLa automatización también está transformando naturaleza del trabajo, no solo eliminándolo. Trabajadores de almacén de Amazon trabajan junto a robots, pero ritmo lo dictan máquinas. Conductores de Uber técnicamente son "independientes" pero algoritmos controlan asignaciones, rutas, y efectivamente salarios mediante ajustes dinámicos de precios. Esta vigilancia algorítmica y gestión automatizada crea nueva forma de control laboral más totalista que supervisores humanos tradicionales.\n\nEl desplazamiento laboral tiene dimensiones geográficas críticas. Comunidades dependientes de manufacturas—Rust Belt estadounidense, regiones industriales de Europa—han sido devastadas por automatización y comercio global. Cuando fábrica cierra, no solo se pierden empleos directos; economías locales completas colapsan. Reentrenamiento suena bien en teoría pero es extremadamente difícil en práctica, especialmente para trabajadores mayores en áreas sin industrias alternativas.\n\nPsicológica y socialmente, trabajo proporciona más que ingreso. Provee identidad, estructura temporal, propósito, comunidad social, y estatus. Cuando trabajo desaparece, estos beneficios no económicos también se pierden. Estudios de desindustrialización muestran aumentos en "muertes de desesperación" (suicidios, sobredosis, alcoholismo), votación por partidos extremos, y desintegración de estructuras comunitarias. Automatización no es solo desafío económico; es crisis existencial y social.\n\nPropuestas de política varían. Ingreso básico universal (UBI) sugiere que gobierno proporcione ingreso incondicional a todos ciudadanos, desconectando supervivencia económica de empleo. Experimentos en Finlandia, Kenia, y California muestran resultados mixtos. Críticos argumentan que es inviable económicamente, desincentivaría trabajo, y no abordaría necesidades no económicas que trabajo satisface. Defensores responden que es inevitable en mundo de abundancia automatizada.\n\nReentrenamiento laboral es respuesta estándar pero efectividad es cuestionable. Programas gubernamentales frecuentemente están mal financiados, desconectados de necesidades del mercado, y no pueden mantenerse al ritmo de cambio tecnológico. Además, asume que habrá suficientes "buenos empleos" nuevos para absorber trabajadores desplazados, suposición cada vez más cuestionable.\n\nReducción de horas laborales es otra propuesta. Semana laboral de 40 horas fue establecida en era industrial; en economía automatizada, quizás 30 o 20 horas semanales deberían ser norma, distribuyendo trabajo disponible más equitativamente mientras proporcionando tiempo para actividades no remuneradas significativas: familia, comunidad, creatividad, descanso. Francia experimentó con semana de 35 horas; resultados fueron debatidos.\n\nPropiedad de robots y IA es cuestión fundamental raramente discutida. Si automatización desplaza trabajo humano pero propiedad de tecnología está concentrada, las ganancias fluirán a pequeña élite mientras mayoría pierde ingresos. Algunos proponen "impuesto a robots" donde automatización es gravada y ingresos financian programas sociales. Otros sugieren propiedad cooperativa de tecnología automatizada, distribuyendo beneficios más ampliamente.\n\nLa narrativa de "trabajos que IA nunca podrá hacer" frecuentemente menciona creatividad, empatía, y juicio ético. Sin embargo, IA ya genera arte, música, y contenido creativo convincente. Chatbots manejan interacciones de servicio al cliente requiriendo "empatía". Decisiones éticas son formalizadas en algoritmos rutinariamente. Quizás no hay santuario inherente de capacidades humanas inmunes a automatización.\n\nParadójicamente, algunos trabajos más difíciles de automatizar son peor remunerados. Cuidadores de ancianos, trabajadores de limpieza, técnicos de reparación requieren destreza física, adaptabilidad, y juicio situacional complejo que robots actuales no pueden replicar. Sin embargo, estos trabajos están entre los peor pagados. Esto revela que salarios no reflejan dificultad de automatización sino estructuras de poder y valoración social histórica.\n\nEl futuro del trabajo no está predeterminado tecnológicamente; es elección política y social. Automatización podría liberar humanidad de trabajo tedioso, permitiendo florecimiento en actividades significativas. O podría crear distopía de desempleo masivo, desigualdad extrema, y pérdida de propósito. La diferencia dependerá de cómo distribuimos beneficios de productividad automatizada, cómo definimos valor y contribución humana más allá de empleo remunerado, y cómo organizamos sociedades donde trabajo humano ya no es central para producción económica. Estas son preguntas fundamentales que determinarán tipo de civilización construimos en siglo XXI.`,
    palabras: 1300,
    preguntas: [
      { pregunta: '¿Qué porcentaje de empleos de EE.UU. el estudio de Oxford proyectó en alto riesgo?', opciones: ['25%','47%','60%','75%'], correcta: 1 },
      { pregunta: '¿Qué hace diferente a la IA según el texto?', opciones: ['Es más rápida','Automatiza trabajo cognitivo, no solo físico','Es más barata','Es más grande'], correcta: 1 },
      { pregunta: '¿Qué significa "gig economy"?', opciones: ['Economía de conciertos musicales','Economía de trabajos por tareas discretas sin empleo formal','Economía grande','Economía global'], correcta: 1 },
      { pregunta: '¿Qué es UBI (Ingreso Básico Universal)?', opciones: ['Un tipo de banco','Ingreso incondicional proporcionado a todos ciudadanos','Un impuesto','Una universidad'], correcta: 1 },
      { pregunta: 'Según el texto, ¿qué trabajos son difíciles de automatizar pero mal pagados?', opciones: ['Programadores','Cuidadores y limpieza','Abogados','Doctores'], correcta: 1 }
    ]
  }
]

  const RECURSOS_POR_NIVEL = {
    principiante: { titulo: 'Recursos para Principiantes', articulos: [], videos: [] },
    intermedio: { titulo: 'Recursos para Nivel Intermedio', articulos: [], videos: [] },
    avanzado: { titulo: 'Recursos para Nivel Avanzado', articulos: [], videos: [] }
  };

  // UTILIDADES para almacenamiento global de todos los alumnos
  const STORAGE_KEY = 'laboratorio_resultados_v1';

  function readAllStoredResults(){
    try{
      const s = localStorage.getItem(STORAGE_KEY);
      return s ? JSON.parse(s) : [];
    }catch(e){
      console.error('Error leyendo storage', e);
      return [];
    }
  }

  function saveResultToStorage(obj){
    const all = readAllStoredResults();
    all.push(obj);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
  }

  function clearAllStoredResults(){
    localStorage.removeItem(STORAGE_KEY);
  }

  // Componente principal
  function LaboratorioLectura(){
    const [pantalla, setPantalla] = useState('inicio');
    const [studentName, setStudentName] = useState('');
    const [nivelSeleccionado, setNivelSeleccionado] = useState(null);
    const [lecturaActual, setLecturaActual] = useState(null);
    const [tiempoInicio, setTiempoInicio] = useState(null);
    const [tiempoFin, setTiempoFin] = useState(null);
    const [respuestas, setRespuestas] = useState([]);
    const [resultados, setResultados] = useState(null);
    const [historialLocal, setHistorialLocal] = useState([]); // historial del alumno en este navegador
    const [tiempoTranscurrido, setTiempoTranscurrido] = useState(0);
    const [showAdmin, setShowAdmin] = useState(false);
    const [allResults, setAllResults] = useState([]);

    useEffect(()=>{
      try{ const s = localStorage.getItem('historial-lecturas'); if(s) setHistorialLocal(JSON.parse(s)); }catch(e){}
      setAllResults(readAllStoredResults());
    },[]);

    useEffect(()=>{
      let intervalo = null;
      if(pantalla === 'lectura' && tiempoInicio){
        intervalo = setInterval(()=>{
          setTiempoTranscurrido(Math.floor((Date.now() - tiempoInicio)/1000));
        },1000);
      } else {
        setTiempoTranscurrido(0);
      }
      return ()=>{ if(intervalo) clearInterval(intervalo); }
    },[pantalla, tiempoInicio]);

    const iniciarTest = (nivel) => {
      if(!studentName || studentName.trim().length < 2){
        alert('Por favor escribe el nombre del alumno antes de comenzar.');
        return;
      }
      const lecturas = (LECTURAS[nivel] && LECTURAS[nivel].length) ? LECTURAS[nivel] : [];
      const lecturaAleatoria = lecturas[Math.floor(Math.random() * lecturas.length)] || { titulo: 'Lectura no disponible', texto: 'No hay lecturas definidas en este nivel', palabras: 100, preguntas: [] };
      setNivelSeleccionado(nivel);
      setLecturaActual(lecturaAleatoria);
      setPantalla('instrucciones-lectura');
    };

    const comenzarLectura = () => { setTiempoInicio(Date.now()); setPantalla('lectura'); };
    const terminarLectura = () => { setTiempoFin(Date.now()); setPantalla('cuestionario'); };

    const responderPregunta = (i, val) => { const c = [...respuestas]; c[i] = val; setRespuestas(c); };

    const calcularResultados = () =>{
      const tiempoSegundos = (tiempoFin - tiempoInicio)/1000;
      const tiempoMinutos = tiempoSegundos/60 || 0.01;
      const velocidad = Math.round((lecturaActual.palabras || 100)/tiempoMinutos);
      let respuestasCorrectas = 0;
      (lecturaActual.preguntas || []).forEach((p, idx)=>{ if(respuestas[idx] === p.correcta) respuestasCorrectas++; });
      const comprension = Math.round((respuestasCorrectas / ((lecturaActual.preguntas||[]).length || 1)) * 100);

      let nivelDetectado = 'principiante'; let mensaje = '';
      if(velocidad >= 300 && comprension >= 80){ nivelDetectado = 'avanzado'; mensaje='¡Excelente!'; }
      else if(velocidad >= 200 && comprension >= 70){ nivelDetectado = 'intermedio'; mensaje='¡Muy bien!'; }
      else { nivelDetectado = 'principiante'; mensaje='Sigue practicando.'; }

      const resultado = {
        id: Date.now(),
        alumno: studentName,
        fecha: new Date().toISOString(),
        velocidad, comprension, nivel: nivelDetectado, lectura: lecturaActual.titulo, tiempo: Math.round(tiempoSegundos)
      };

      // Guardado local (por alumno en este navegador)
      try{
        const h = JSON.parse(localStorage.getItem('historial-lecturas') || '[]');
        h.push(resultado);
        localStorage.setItem('historial-lecturas', JSON.stringify(h));
        setHistorialLocal(h);
      }catch(e){ console.error('error guardando historial local', e); }

      // Guardado global (para que tú puedas ver todos los alumnos desde este navegador)
      saveResultToStorage(resultado);
      setAllResults(readAllStoredResults());
// === Enviar también a Google Sheets ===
      fetch("https://script.google.com/macros/s/AKfycbxGUevZRLb124GT_KQIzvJc6c-1qSHswEgsrVxVh_rpLN-7nhbmQ1djQZf0LGyViSGURQ/exec", {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
    nombre: resultado.alumno,
    titulo: resultado.lectura,
    velocidad: resultado.velocidad,
    comprension: resultado.comprension,
    nivel: resultado.nivel,
    tiempo: resultado.tiempo,
    fecha: new Date().toLocaleString()
  })
      }).then(() => {
        console.log("✅ Resultado enviado a Google Sheets");
      }).catch(err => {
        console.error("❌ Error al enviar a Google Sheets:", err);
      });
      setResultados({...resultado, mensaje});
      setPantalla('resultados');
    };

    const reiniciar = ()=>{
      setPantalla('inicio'); setNivelSeleccionado(null); setLecturaActual(null); setTiempoInicio(null); setTiempoFin(null); setRespuestas([]); setResultados(null); setTiempoTranscurrido(0);
    };

    // Export CSV simple
    const exportCSV = ()=>{
      const rows = readAllStoredResults();
      if(!rows.length){ alert('No hay resultados guardados'); return; }
      const headers = Object.keys(rows[0]);
      const csv = [headers.join(',')].concat(rows.map(r=> headers.map(h=> '"'+String(r[h]||'')+'"').join(','))).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'laboratorio_resultados.csv'; a.click(); URL.revokeObjectURL(url);
    };

    return (
      <div>
        {/* Barra superior con botón ver resultados (solo tú lo usarás en este navegador) */}
        <div className="fixed top-4 right-4 z-50">
          <button className="bg-white px-3 py-2 rounded-lg shadow" onClick={()=>{ setAllResults(readAllStoredResults()); setShowAdmin(true); }}>
            Ver resultados guardados
          </button>
        </div>

        {pantalla === 'inicio' && (
          <div className="min-h-screen bg-gradient-to-br from-blue-50 to-blue-100 p-6">
            <div className="max-w-4xl mx-auto">
              <div className="bg-white rounded-2xl shadow-xl p-8">
                <div className="text-center mb-6">
                  <div className="icon-block"><i data-lucide={ICONS.sparkle} className="icon"></i></div>
                  <h1 className="text-4xl font-extrabold mb-2" style={{color:'#0e4481'}}>Laboratorio de Lectura</h1>
                  <p className="text-lg" style={{color:'#0e4481', opacity:0.8}}>Nombre del alumno (obligatorio para guardar resultados)</p>
                </div>

                <div className="mb-4">
                  <input value={studentName} onChange={e=>setStudentName(e.target.value)} placeholder="Escribe el nombre del alumno" className="w-full border p-3 rounded-lg" />
                </div>

                <div className="mb-8">
                  <h3 className="text-xl font-bold mb-4 text-center" style={{color:'#0e4481'}}>Selecciona tu nivel de inicio:</h3>
                  <div className="grid md:grid-cols-3 gap-4">
                    <button onClick={()=>iniciarTest('basico')} className="border-2 rounded-xl p-6 transition-all transform hover:scale-105" style={{backgroundColor:'rgba(239,231,34,0.15)', borderColor:'#efe722'}}>
                      <div className="text-center"><div className="icon-block"><i data-lucide={ICONS.target} className="icon"></i></div><h4 className="font-bold text-lg mb-2" style={{color:'#0e4481'}}>Básico</h4></div>
                    </button>
                    <button onClick={()=>iniciarTest('intermedio')} className="border-2 rounded-xl p-6 transition-all transform hover:scale-105" style={{backgroundColor:'rgba(255,152,26,0.15)', borderColor:'#ff981a'}}>
                      <div className="text-center"><div className="icon-block"><i data-lucide={ICONS.chart} className="icon"></i></div><h4 className="font-bold text-lg mb-2" style={{color:'#0e4481'}}>Intermedio</h4></div>
                    </button>
                    <button onClick={()=>iniciarTest('avanzado')} className="border-2 rounded-xl p-6 transition-all transform hover:scale-105" style={{backgroundColor:'rgba(48,189,196,0.15)', borderColor:'#30bdc4'}}>
                      <div className="text-center"><div className="icon-block"><i data-lucide={ICONS.trophy} className="icon"></i></div><h4 className="font-bold text-lg mb-2" style={{color:'#0e4481'}}>Avanzado</h4></div>
                    </button>
                  </div>
                </div>

                {historialLocal.length > 0 && (
                  <div className="bg-gray-50 rounded-lg p-6">
                    <h3 className="font-bold mb-3">Tu progreso reciente</h3>
                    <div className="space-y-2">
                      {historialLocal.slice(-3).reverse().map((it, idx)=> (
                        <div key={idx} className="flex justify-between items-center text-sm bg-white p-3 rounded-lg">
                          <span>{new Date(it.fecha).toLocaleDateString()}</span>
                          <span className="font-bold">{it.velocidad} ppm</span>
                          <span>{it.comprension}%</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

              </div>
            </div>
          </div>
        )}

        {pantalla === 'instrucciones-lectura' && (
          <div className="min-h-screen bg-gradient-to-br from-blue-50 to-blue-100 p-6">
            <div className="max-w-3xl mx-auto">
              <div className="bg-white rounded-2xl shadow-xl p-8">
                <h2 className="text-3xl font-extrabold mb-6 text-center" style={{color:'#0e4481'}}>Preparado para leer</h2>
                <div className="rounded-lg p-6 mb-6" style={{backgroundColor:'rgba(48,189,196,0.15)'}}>
                  <h3 className="font-bold text-lg mb-3" style={{color:'#0e4481'}}>Tu lectura de hoy:</h3>
                  <p className="text-2xl font-extrabold mb-2" style={{color:'#30bdc4'}}>{lecturaActual.titulo}</p>
                  <p style={{color:'#0e4481', opacity:0.7}}>Tema: {lecturaActual.tema} • {lecturaActual.palabras} palabras</p>
                </div>
                <button onClick={comenzarLectura} className="w-full text-white font-bold py-4 px-6 rounded-lg" style={{backgroundColor:'#0e4481'}}><i data-lucide={ICONS.arrow} className="icon"></i> Comenzar Lectura</button>
              </div>
            </div>
          </div>
        )}

        {pantalla === 'lectura' && (
          <div className="min-h-screen bg-gradient-to-br from-blue-50 to-blue-100 p-6">
            <div className="max-w-4xl mx-auto">
              <div className="bg-white rounded-2xl shadow-xl p-8">
                <div className="flex justify-between items-center mb-6">
                  <h2 className="text-2xl font-bold" style={{color:'#0e4481'}}>{lecturaActual.titulo}</h2>
                  <div className="px-6 py-3 rounded-lg" style={{backgroundColor:'rgba(48,189,196,0.2)'}}>
                    <div className="flex items-center space-x-2"><div><i data-lucide={ICONS.clock} className="icon"></i></div><span className="text-2xl font-mono font-bold" style={{color:'#30bdc4'}}>{String(Math.floor(tiempoTranscurrido/60)).padStart(2,'0')}:{String(tiempoTranscurrido%60).padStart(2,'0')}</span></div>
                  </div>
                </div>

                <div className="prose max-w-none mb-8"><div className="text-lg leading-relaxed whitespace-pre-line" style={{color:'#0e4481'}}>{lecturaActual.texto}</div></div>

                <button onClick={terminarLectura} className="w-full text-white font-bold py-4 px-6 rounded-lg" style={{backgroundColor:'#e6be1c'}}><i data-lucide={ICONS.arrow} className="icon"></i> Terminé de Leer - Ir a Preguntas</button>
              </div>
            </div>
          </div>
        )}

        {pantalla === 'cuestionario' && (
          <div className="min-h-screen bg-gradient-to-br from-blue-50 to-blue-100 p-6">
            <div className="max-w-4xl mx-auto">
              <div className="bg-white rounded-2xl shadow-xl p-8">
                <h2 className="text-3xl font-extrabold mb-2 text-center" style={{color:'#0e4481'}}>Test de Comprensión</h2>
                <p className="text-center mb-8" style={{color:'#0e4481', opacity:0.7}}>Responde sin volver al texto</p>

                <div className="space-y-6 mb-8">
                  {(lecturaActual.preguntas||[]).map((pregunta, indicePregunta)=> (
                    <div key={indicePregunta} className="bg-gray-50 rounded-lg p-6">
                      <h3 className="font-bold mb-4" style={{color:'#0e4481'}}>{indicePregunta+1}. {pregunta.pregunta}</h3>
                      <div className="space-y-3">{pregunta.opciones.map((opcion, idx)=> (
                        <button key={idx} onClick={()=>responderPregunta(indicePregunta, idx)} className="w-full text-left p-4 rounded-lg border-2 transition-all bg-white" style={{borderColor: respuestas[indicePregunta]===idx ? '#30bdc4' : '#e5e7eb', backgroundColor: respuestas[indicePregunta]===idx ? 'rgba(48,189,196,0.1)' : 'white'}}>
                          <span className="font-medium" style={{color:'#0e4481'}}>{opcion}</span>
                        </button>
                      ))}</div>
                    </div>
                  ))}
                </div>

                <button onClick={calcularResultados} disabled={!(respuestas.length === (lecturaActual.preguntas||[]).length && respuestas.every(r=>r!==undefined))} className="w-full font-bold py-4 px-6 rounded-lg text-white" style={{backgroundColor: (respuestas.length === (lecturaActual.preguntas||[]).length && respuestas.every(r=>r!==undefined))? '#0e4481':'#d1d5db'}}><i data-lucide={ICONS.arrow} className="icon"></i> Ver Mis Resultados</button>
              </div>
            </div>
          </div>
        )}

        {pantalla === 'resultados' && resultados && (
          <div className="min-h-screen bg-gradient-to-br from-blue-50 to-blue-100 p-6">
            <div className="max-w-4xl mx-auto">
              <div className="bg-white rounded-2xl shadow-xl p-8">
                <div className="text-center mb-8"><div className="icon-block"><i data-lucide={ICONS.trophy} className="icon"></i></div><h2 className="text-3xl font-extrabold mb-2" style={{color:'#0e4481'}}>¡Test Completado!</h2><p style={{color:'#0e4481', opacity:0.8}}>{resultados.mensaje}</p></div>

                <div className="grid md:grid-cols-2 gap-6 mb-8">
                  <div className="rounded-xl p-6 text-white" style={{background:'linear-gradient(135deg,#30bdc4 0%, #0e4481 100%)'}}>
                    <div className="flex items-center justify-between mb-2"><span className="opacity-90">Velocidad de Lectura</span><div><i data-lucide={ICONS.chart} className="icon"></i></div></div>
                    <p className="text-4xl font-extrabold mb-1">{resultados.velocidad}</p>
                    <p className="opacity-90">palabras por minuto</p>
                  </div>

                  <div className="rounded-xl p-6 text-white" style={{background:'linear-gradient(135deg,#e6be1c 0%, #efe722 100%)'}}>
                    <div className="flex items-center justify-between mb-2"><span className="opacity-90">Comprensión Lectora</span><div><i data-lucide={ICONS.target} className="icon"></i></div></div>
                    <p className="text-4xl font-extrabold mb-1">{resultados.comprension}%</p>
                    <p className="opacity-90">de respuestas correctas</p>
                  </div>
                </div>

                <div className="flex gap-4"><button onClick={reiniciar} className="flex-1 text-white font-bold py-4 px-6 rounded-lg" style={{backgroundColor:'#0e4481'}}><i data-lucide={ICONS.refresh} className="icon"></i> Hacer Otro Test</button></div>
              </div>
            </div>
          </div>
        )}

        {/* Modal / Admin simple para ver, exportar o borrar resultados guardados */}
        {showAdmin && (
          <div className="fixed inset-0 bg-black/50 z-50 flex items-start justify-center p-6">
            <div className="bg-white rounded-lg shadow-xl max-w-5xl w-full p-6 overflow-auto" style={{maxHeight:'90vh'}}>
              <div className="flex justify-between items-center mb-4">
                <h3 className="text-xl font-bold">Resultados guardados (local)</h3>
                <div className="flex gap-2">
                  <button onClick={exportCSV} className="px-3 py-2 bg-blue-600 text-white rounded">Exportar CSV</button>
                  <button onClick={()=>{ if(confirm('Borrar TODOS los resultados guardados?')){ clearAllStoredResults(); setAllResults([]); alert('Resultados borrados'); } }} className="px-3 py-2 bg-red-600 text-white rounded">Borrar todo</button>
                  <button onClick={()=>setShowAdmin(false)} className="px-3 py-2 bg-gray-200 rounded">Cerrar</button>
                </div>
              </div>

              <div className="overflow-auto">
                <table className="min-w-full table-auto border-collapse">
                  <thead>
                    <tr className="text-left">
                      <th className="p-2">Alumno</th>
                      <th className="p-2">Fecha</th>
                      <th className="p-2">Lectura</th>
                      <th className="p-2">Velocidad</th>
                      <th className="p-2">Comprensión</th>
                      <th className="p-2">Nivel</th>
                    </tr>
                  </thead>
                  <tbody>
                    {allResults.map((r, idx)=> (
                      <tr key={idx} className="border-t">
                        <td className="p-2">{r.alumno}</td>
                        <td className="p-2">{new Date(r.fecha).toLocaleString()}</td>
                        <td className="p-2">{r.lectura}</td>
                        <td className="p-2">{r.velocidad}</td>
                        <td className="p-2">{r.comprension}%</td>
                        <td className="p-2">{r.nivel}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
                {allResults.length===0 && <p className="mt-4">No hay resultados guardados aún.</p>}
              </div>
            </div>
          </div>
        )}

      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<LaboratorioLectura />);
    // Después de renderizar React, activar los íconos Lucide
setTimeout(() => {
  lucide.createIcons();
}, 100);

  </script>
</body>
</html>
