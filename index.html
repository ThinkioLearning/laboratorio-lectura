    texto: 'La comida callejera ofrece una ventana auténtica a la cultura culinaria de cada país. Estos platos económicos y deliciosos cuentan historias de tradición e innovación.\\n\\nEn México, los tacos callejeros son legendarios. Carne asada, al pastor o carnitas servidos en tortillas frescas con cilantro, cebolla y salsa. Cada región tiene su estilo único.\\n\\nTailandia es famosa por su Pad Thai. Este plato de fideos salteados se cocina en woks calientes en carritos callejeros por todas partes de Bangkok.\\n\\nEn Turquía, el döner kebab domina las calles. Carne asada verticalmente se corta en finas láminas y se sirve en pan pita con vegetales frescos y salsas.\\n\\nLa India ofrece samosas crujientes. Estos triángulos fritos rellenos de papas especiadas y guisantes son un snack popular vendido en cada esquina.\\n\\nNueva York tiene sus icónicos hot dogs. Vendidos desde carritos característicos, estos perros calientes son parte integral de la experiencia neoyorquina.\\n\\nLa comida callejera no solo alimenta, también conecta comunidades y preserva recetas tradicionales transmitidas por generaciones.',
    palabras: 167,
    preguntas: [
      { pregunta: '¿Qué ofrece la comida callejera sobre un país?', opciones: ['Solo comida barata','Una ventana a su cultura','Comida rápida','Experimentos culinarios'], correcta: 1 },
      { pregunta: '¿Qué país es famoso por el Pad Thai?', opciones: ['China','Japón','Tailandia','Vietnam'], correcta: 2 },
      { pregunta: '¿Cómo se cocina la carne del döner kebab?', opciones: ['Hervida','Asada verticalmente','Frita','Al vapor'], correcta: 1 },
      { pregunta: '¿De qué están rellenas las samosas indias?', opciones: ['Carne y arroz','Papas especiadas y guisantes','Solo vegetales','Queso'], correcta: 1 },
      { pregunta: '¿Qué hace la comida callejera además de alimentar?', opciones: ['Solo genera dinero','Conecta comunidades','Es turística','Es moderna'], correcta: 1 }
    ]
  }
        // Puedes pegar aquí el resto de lecturas tal cual como en tu versión anterior.
      ]
    };
  })();

  const RECURSOS_POR_NIVEL = {
    principiante: { titulo: 'Recursos para Principiantes', articulos: [], videos: [] },
    intermedio: { titulo: 'Recursos para Nivel Intermedio', articulos: [], videos: [] },
    avanzado: { titulo: 'Recursos para Nivel Avanzado', articulos: [], videos: [] }
  };

  // UTILIDADES para almacenamiento global de todos los alumnos
  const STORAGE_KEY = 'laboratorio_resultados_v1';

  function readAllStoredResults(){
    try{
      const s = localStorage.getItem(STORAGE_KEY);
      return s ? JSON.parse(s) : [];
    }catch(e){
      console.error('Error leyendo storage', e);
      return [];
    }
  }

  function saveResultToStorage(obj){
    const all = readAllStoredResults();
    all.push(obj);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
  }

  function clearAllStoredResults(){
    localStorage.removeItem(STORAGE_KEY);
  }

  // Componente principal
  function LaboratorioLectura(){
    const [pantalla, setPantalla] = useState('inicio');
    const [studentName, setStudentName] = useState('');
    const [nivelSeleccionado, setNivelSeleccionado] = useState(null);
    const [lecturaActual, setLecturaActual] = useState(null);
    const [tiempoInicio, setTiempoInicio] = useState(null);
    const [tiempoFin, setTiempoFin] = useState(null);
    const [respuestas, setRespuestas] = useState([]);
    const [resultados, setResultados] = useState(null);
    const [historialLocal, setHistorialLocal] = useState([]); // historial del alumno en este navegador
    const [tiempoTranscurrido, setTiempoTranscurrido] = useState(0);
    const [showAdmin, setShowAdmin] = useState(false);
    const [allResults, setAllResults] = useState([]);

    useEffect(()=>{
      try{ const s = localStorage.getItem('historial-lecturas'); if(s) setHistorialLocal(JSON.parse(s)); }catch(e){}
      setAllResults(readAllStoredResults());
    },[]);

    useEffect(()=>{
      let intervalo = null;
      if(pantalla === 'lectura' && tiempoInicio){
        intervalo = setInterval(()=>{
          setTiempoTranscurrido(Math.floor((Date.now() - tiempoInicio)/1000));
        },1000);
      } else {
        setTiempoTranscurrido(0);
      }
      return ()=>{ if(intervalo) clearInterval(intervalo); }
    },[pantalla, tiempoInicio]);

    const iniciarTest = (nivel) => {
      if(!studentName || studentName.trim().length < 2){
        alert('Por favor escribe el nombre del alumno antes de comenzar.');
        return;
      }
      const lecturas = (LECTURAS[nivel] && LECTURAS[nivel].length) ? LECTURAS[nivel] : [];
      const lecturaAleatoria = lecturas[Math.floor(Math.random() * lecturas.length)] || { titulo: 'Lectura no disponible', texto: 'No hay lecturas definidas en este nivel', palabras: 100, preguntas: [] };
      setNivelSeleccionado(nivel);
      setLecturaActual(lecturaAleatoria);
      setPantalla('instrucciones-lectura');
    };

    const comenzarLectura = () => { setTiempoInicio(Date.now()); setPantalla('lectura'); };
    const terminarLectura = () => { setTiempoFin(Date.now()); setPantalla('cuestionario'); };

    const responderPregunta = (i, val) => { const c = [...respuestas]; c[i] = val; setRespuestas(c); };

    const calcularResultados = () =>{
      const tiempoSegundos = (tiempoFin - tiempoInicio)/1000;
      const tiempoMinutos = tiempoSegundos/60 || 0.01;
      const velocidad = Math.round((lecturaActual.palabras || 100)/tiempoMinutos);
      let respuestasCorrectas = 0;
      (lecturaActual.preguntas || []).forEach((p, idx)=>{ if(respuestas[idx] === p.correcta) respuestasCorrectas++; });
      const comprension = Math.round((respuestasCorrectas / ((lecturaActual.preguntas||[]).length || 1)) * 100);

      let nivelDetectado = 'principiante'; let mensaje = '';
      if(velocidad >= 300 && comprension >= 80){ nivelDetectado = 'avanzado'; mensaje='¡Excelente!'; }
      else if(velocidad >= 200 && comprension >= 70){ nivelDetectado = 'intermedio'; mensaje='¡Muy bien!'; }
      else { nivelDetectado = 'principiante'; mensaje='Sigue practicando.'; }

      const resultado = {
        id: Date.now(),
        alumno: studentName,
        fecha: new Date().toISOString(),
        velocidad, comprension, nivel: nivelDetectado, lectura: lecturaActual.titulo, tiempo: Math.round(tiempoSegundos)
      };

      // Guardado local (por alumno en este navegador)
      try{
        const h = JSON.parse(localStorage.getItem('historial-lecturas') || '[]');
        h.push(resultado);
        localStorage.setItem('historial-lecturas', JSON.stringify(h));
        setHistorialLocal(h);
      }catch(e){ console.error('error guardando historial local', e); }

      // Guardado global (para que tú puedas ver todos los alumnos desde este navegador)
      saveResultToStorage(resultado);
      setAllResults(readAllStoredResults());
// === Enviar también a Google Sheets ===
      fetch("https://script.google.com/macros/s/AKfycbxGUevZRLb124GT_KQIzvJc6c-1qSHswEgsrVxVh_rpLN-7nhbmQ1djQZf0LGyViSGURQ/exec", {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
    nombre: resultado.alumno,
    titulo: resultado.lectura,
    velocidad: resultado.velocidad,
    comprension: resultado.comprension,
    nivel: resultado.nivel,
    tiempo: resultado.tiempo,
    fecha: new Date().toLocaleString()
  })
      }).then(() => {
        console.log("✅ Resultado enviado a Google Sheets");
      }).catch(err => {
        console.error("❌ Error al enviar a Google Sheets:", err);
      });
      setResultados({...resultado, mensaje});
      setPantalla('resultados');
    };

    const reiniciar = ()=>{
      setPantalla('inicio'); setNivelSeleccionado(null); setLecturaActual(null); setTiempoInicio(null); setTiempoFin(null); setRespuestas([]); setResultados(null); setTiempoTranscurrido(0);
    };

    // Export CSV simple
    const exportCSV = ()=>{
      const rows = readAllStoredResults();
      if(!rows.length){ alert('No hay resultados guardados'); return; }
      const headers = Object.keys(rows[0]);
      const csv = [headers.join(',')].concat(rows.map(r=> headers.map(h=> '"'+String(r[h]||'')+'"').join(','))).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'laboratorio_resultados.csv'; a.click(); URL.revokeObjectURL(url);
    };

    return (
      <div>
        {/* Barra superior con botón ver resultados (solo tú lo usarás en este navegador) */}
        <div className="fixed top-4 right-4 z-50">
          <button className="bg-white px-3 py-2 rounded-lg shadow" onClick={()=>{ setAllResults(readAllStoredResults()); setShowAdmin(true); }}>
            Ver resultados guardados
          </button>
        </div>

        {pantalla === 'inicio' && (
          <div className="min-h-screen bg-gradient-to-br from-blue-50 to-blue-100 p-6">
            <div className="max-w-4xl mx-auto">
              <div className="bg-white rounded-2xl shadow-xl p-8">
                <div className="text-center mb-6">
                  <div className="icon-block"><i data-lucide={ICONS.sparkle} className="icon"></i></div>
                  <h1 className="text-4xl font-extrabold mb-2" style={{color:'#0e4481'}}>Laboratorio de Lectura</h1>
                  <p className="text-lg" style={{color:'#0e4481', opacity:0.8}}>Nombre del alumno (obligatorio para guardar resultados)</p>
                </div>

                <div className="mb-4">
                  <input value={studentName} onChange={e=>setStudentName(e.target.value)} placeholder="Escribe el nombre del alumno" className="w-full border p-3 rounded-lg" />
                </div>

                <div className="mb-8">
                  <h3 className="text-xl font-bold mb-4 text-center" style={{color:'#0e4481'}}>Selecciona tu nivel de inicio:</h3>
                  <div className="grid md:grid-cols-3 gap-4">
                    <button onClick={()=>iniciarTest('basico')} className="border-2 rounded-xl p-6 transition-all transform hover:scale-105" style={{backgroundColor:'rgba(239,231,34,0.15)', borderColor:'#efe722'}}>
                      <div className="text-center"><div className="icon-block"><i data-lucide={ICONS.target} className="icon"></i></div><h4 className="font-bold text-lg mb-2" style={{color:'#0e4481'}}>Básico</h4></div>
                    </button>
                    <button onClick={()=>iniciarTest('intermedio')} className="border-2 rounded-xl p-6 transition-all transform hover:scale-105" style={{backgroundColor:'rgba(255,152,26,0.15)', borderColor:'#ff981a'}}>
                      <div className="text-center"><div className="icon-block"><i data-lucide={ICONS.chart} className="icon"></i></div><h4 className="font-bold text-lg mb-2" style={{color:'#0e4481'}}>Intermedio</h4></div>
                    </button>
                    <button onClick={()=>iniciarTest('avanzado')} className="border-2 rounded-xl p-6 transition-all transform hover:scale-105" style={{backgroundColor:'rgba(48,189,196,0.15)', borderColor:'#30bdc4'}}>
                      <div className="text-center"><div className="icon-block"><i data-lucide={ICONS.trophy} className="icon"></i></div><h4 className="font-bold text-lg mb-2" style={{color:'#0e4481'}}>Avanzado</h4></div>
                    </button>
                  </div>
                </div>

                {historialLocal.length > 0 && (
                  <div className="bg-gray-50 rounded-lg p-6">
                    <h3 className="font-bold mb-3">Tu progreso reciente</h3>
                    <div className="space-y-2">
                      {historialLocal.slice(-3).reverse().map((it, idx)=> (
                        <div key={idx} className="flex justify-between items-center text-sm bg-white p-3 rounded-lg">
                          <span>{new Date(it.fecha).toLocaleDateString()}</span>
                          <span className="font-bold">{it.velocidad} ppm</span>
                          <span>{it.comprension}%</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

              </div>
            </div>
          </div>
        )}

        {pantalla === 'instrucciones-lectura' && (
          <div className="min-h-screen bg-gradient-to-br from-blue-50 to-blue-100 p-6">
            <div className="max-w-3xl mx-auto">
              <div className="bg-white rounded-2xl shadow-xl p-8">
                <h2 className="text-3xl font-extrabold mb-6 text-center" style={{color:'#0e4481'}}>Preparado para leer</h2>
                <div className="rounded-lg p-6 mb-6" style={{backgroundColor:'rgba(48,189,196,0.15)'}}>
                  <h3 className="font-bold text-lg mb-3" style={{color:'#0e4481'}}>Tu lectura de hoy:</h3>
                  <p className="text-2xl font-extrabold mb-2" style={{color:'#30bdc4'}}>{lecturaActual.titulo}</p>
                  <p style={{color:'#0e4481', opacity:0.7}}>Tema: {lecturaActual.tema} • {lecturaActual.palabras} palabras</p>
                </div>
                <button onClick={comenzarLectura} className="w-full text-white font-bold py-4 px-6 rounded-lg" style={{backgroundColor:'#0e4481'}}><i data-lucide={ICONS.arrow} className="icon"></i> Comenzar Lectura</button>
              </div>
            </div>
          </div>
        )}

        {pantalla === 'lectura' && (
          <div className="min-h-screen bg-gradient-to-br from-blue-50 to-blue-100 p-6">
            <div className="max-w-4xl mx-auto">
              <div className="bg-white rounded-2xl shadow-xl p-8">
                <div className="flex justify-between items-center mb-6">
                  <h2 className="text-2xl font-bold" style={{color:'#0e4481'}}>{lecturaActual.titulo}</h2>
                  <div className="px-6 py-3 rounded-lg" style={{backgroundColor:'rgba(48,189,196,0.2)'}}>
                    <div className="flex items-center space-x-2"><div><i data-lucide={ICONS.clock} className="icon"></i></div><span className="text-2xl font-mono font-bold" style={{color:'#30bdc4'}}>{String(Math.floor(tiempoTranscurrido/60)).padStart(2,'0')}:{String(tiempoTranscurrido%60).padStart(2,'0')}</span></div>
                  </div>
                </div>

                <div className="prose max-w-none mb-8"><div className="text-lg leading-relaxed whitespace-pre-line" style={{color:'#0e4481'}}>{lecturaActual.texto}</div></div>

                <button onClick={terminarLectura} className="w-full text-white font-bold py-4 px-6 rounded-lg" style={{backgroundColor:'#e6be1c'}}><i data-lucide={ICONS.arrow} className="icon"></i> Terminé de Leer - Ir a Preguntas</button>
              </div>
            </div>
          </div>
        )}

        {pantalla === 'cuestionario' && (
          <div className="min-h-screen bg-gradient-to-br from-blue-50 to-blue-100 p-6">
            <div className="max-w-4xl mx-auto">
              <div className="bg-white rounded-2xl shadow-xl p-8">
                <h2 className="text-3xl font-extrabold mb-2 text-center" style={{color:'#0e4481'}}>Test de Comprensión</h2>
                <p className="text-center mb-8" style={{color:'#0e4481', opacity:0.7}}>Responde sin volver al texto</p>

                <div className="space-y-6 mb-8">
                  {(lecturaActual.preguntas||[]).map((pregunta, indicePregunta)=> (
                    <div key={indicePregunta} className="bg-gray-50 rounded-lg p-6">
                      <h3 className="font-bold mb-4" style={{color:'#0e4481'}}>{indicePregunta+1}. {pregunta.pregunta}</h3>
                      <div className="space-y-3">{pregunta.opciones.map((opcion, idx)=> (
                        <button key={idx} onClick={()=>responderPregunta(indicePregunta, idx)} className="w-full text-left p-4 rounded-lg border-2 transition-all bg-white" style={{borderColor: respuestas[indicePregunta]===idx ? '#30bdc4' : '#e5e7eb', backgroundColor: respuestas[indicePregunta]===idx ? 'rgba(48,189,196,0.1)' : 'white'}}>
                          <span className="font-medium" style={{color:'#0e4481'}}>{opcion}</span>
                        </button>
                      ))}</div>
                    </div>
                  ))}
                </div>

                <button onClick={calcularResultados} disabled={!(respuestas.length === (lecturaActual.preguntas||[]).length && respuestas.every(r=>r!==undefined))} className="w-full font-bold py-4 px-6 rounded-lg text-white" style={{backgroundColor: (respuestas.length === (lecturaActual.preguntas||[]).length && respuestas.every(r=>r!==undefined))? '#0e4481':'#d1d5db'}}><i data-lucide={ICONS.arrow} className="icon"></i> Ver Mis Resultados</button>
              </div>
            </div>
          </div>
        )}

        {pantalla === 'resultados' && resultados && (
          <div className="min-h-screen bg-gradient-to-br from-blue-50 to-blue-100 p-6">
            <div className="max-w-4xl mx-auto">
              <div className="bg-white rounded-2xl shadow-xl p-8">
                <div className="text-center mb-8"><div className="icon-block"><i data-lucide={ICONS.trophy} className="icon"></i></div><h2 className="text-3xl font-extrabold mb-2" style={{color:'#0e4481'}}>¡Test Completado!</h2><p style={{color:'#0e4481', opacity:0.8}}>{resultados.mensaje}</p></div>

                <div className="grid md:grid-cols-2 gap-6 mb-8">
                  <div className="rounded-xl p-6 text-white" style={{background:'linear-gradient(135deg,#30bdc4 0%, #0e4481 100%)'}}>
                    <div className="flex items-center justify-between mb-2"><span className="opacity-90">Velocidad de Lectura</span><div><i data-lucide={ICONS.chart} className="icon"></i></div></div>
                    <p className="text-4xl font-extrabold mb-1">{resultados.velocidad}</p>
                    <p className="opacity-90">palabras por minuto</p>
                  </div>

                  <div className="rounded-xl p-6 text-white" style={{background:'linear-gradient(135deg,#e6be1c 0%, #efe722 100%)'}}>
                    <div className="flex items-center justify-between mb-2"><span className="opacity-90">Comprensión Lectora</span><div><i data-lucide={ICONS.target} className="icon"></i></div></div>
                    <p className="text-4xl font-extrabold mb-1">{resultados.comprension}%</p>
                    <p className="opacity-90">de respuestas correctas</p>
                  </div>
                </div>

                <div className="flex gap-4"><button onClick={reiniciar} className="flex-1 text-white font-bold py-4 px-6 rounded-lg" style={{backgroundColor:'#0e4481'}}><i data-lucide={ICONS.refresh} className="icon"></i> Hacer Otro Test</button></div>
              </div>
            </div>
          </div>
        )}

        {/* Modal / Admin simple para ver, exportar o borrar resultados guardados */}
        {showAdmin && (
          <div className="fixed inset-0 bg-black/50 z-50 flex items-start justify-center p-6">
            <div className="bg-white rounded-lg shadow-xl max-w-5xl w-full p-6 overflow-auto" style={{maxHeight:'90vh'}}>
              <div className="flex justify-between items-center mb-4">
                <h3 className="text-xl font-bold">Resultados guardados (local)</h3>
                <div className="flex gap-2">
                  <button onClick={exportCSV} className="px-3 py-2 bg-blue-600 text-white rounded">Exportar CSV</button>
                  <button onClick={()=>{ if(confirm('Borrar TODOS los resultados guardados?')){ clearAllStoredResults(); setAllResults([]); alert('Resultados borrados'); } }} className="px-3 py-2 bg-red-600 text-white rounded">Borrar todo</button>
                  <button onClick={()=>setShowAdmin(false)} className="px-3 py-2 bg-gray-200 rounded">Cerrar</button>
                </div>
              </div>

              <div className="overflow-auto">
                <table className="min-w-full table-auto border-collapse">
                  <thead>
                    <tr className="text-left">
                      <th className="p-2">Alumno</th>
                      <th className="p-2">Fecha</th>
                      <th className="p-2">Lectura</th>
                      <th className="p-2">Velocidad</th>
                      <th className="p-2">Comprensión</th>
                      <th className="p-2">Nivel</th>
                    </tr>
                  </thead>
                  <tbody>
                    {allResults.map((r, idx)=> (
                      <tr key={idx} className="border-t">
                        <td className="p-2">{r.alumno}</td>
                        <td className="p-2">{new Date(r.fecha).toLocaleString()}</td>
                        <td className="p-2">{r.lectura}</td>
                        <td className="p-2">{r.velocidad}</td>
                        <td className="p-2">{r.comprension}%</td>
                        <td className="p-2">{r.nivel}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
                {allResults.length===0 && <p className="mt-4">No hay resultados guardados aún.</p>}
              </div>
            </div>
          </div>
        )}

      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<LaboratorioLectura />);
    // Después de renderizar React, activar los íconos Lucide
setTimeout(() => {
  lucide.createIcons();
}, 100);

  </script>
</body>
</html>
